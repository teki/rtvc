[package]
name = "rtvc"
version = "0.4.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cpal = { version = "0.17", optional = true }
egui = { version = "0.31", optional = true }
eframe = { version = "0.31", optional = true }
png = { version = "0.17", optional = true }
rfd = { version = "0.15", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["native"]
native = ["dep:cpal", "dep:egui", "dep:eframe", "dep:png", "dep:rfd", "dep:zip"]
wasm = ["dep:wasm-bindgen"]
web-vid-simple = []
web-vid-realistic = []

[[bin]]
name = "rtvc"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "fuse_test"
path = "src/fuse_test.rs"

[[bin]]
name = "zex_test"
path = "src/zex_test.rs"

[[bin]]
name = "perf_test"
path = "src/perf_test.rs"

[[bin]]
name = "cas2wav"
path = "src/cas2wav.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
